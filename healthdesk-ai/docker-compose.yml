services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthdesk
      POSTGRES_PASSWORD: healthdesk
      POSTGRES_DB: healthdesk
    ports:
      - "5432:5432"
    volumes:
      - healthdesk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthdesk -d healthdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://healthdesk:healthdesk@db:5432/healthdesk
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development_secret_change_me_min_32_chars}
      LLM_PROVIDER: groq
      LLM_MODEL: openai/gpt-oss-20b
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXTAUTH_URL: http://localhost:3000
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      BACKEND_API_URL: http://backend:8000/api/v1
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  healthdesk_data:
